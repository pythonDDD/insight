name: Observe markets and publish Pages

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: insight-pages
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Test calculations and failure handling
        run: python -m unittest discover -s tests -v
      - name: Restore previous observations
        run: python scripts/history_branch.py restore
      - name: Fetch public prices, prediction markets, news and calendar
        run: python scripts/update.py
      - name: Validate and build the site
        run: python scripts/build.py
      - name: Preserve observations for subsequent validation
        run: python scripts/history_branch.py save
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
